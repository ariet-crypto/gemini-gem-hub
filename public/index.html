<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131314"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><title>Gem Hub</title>
<style>
:root{color-scheme:dark;--bg:#131314;--panel:#1e1f20;--p2:#292b2e;--text:#e3e3e3;--muted:#aeb0b3;--blue:#a8c7fa;--line:#3c4043}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Arial;height:100dvh;overflow:hidden}button,textarea,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{height:100%;display:flex}.sidebar{width:290px;background:#1b1c1d;padding:15px 12px;display:flex;flex-direction:column;gap:13px;flex-shrink:0}.brand{display:flex;gap:11px;align-items:center;padding:5px 8px;font-size:19px}.spark{color:var(--blue);font-size:24px}.side-btn{background:transparent;border-radius:24px;text-align:left;padding:11px 14px;display:flex;gap:12px;align-items:center;width:100%}.side-btn:hover,.gem:hover{background:#2a2c2e}.side-btn.active,.gem.active{background:#30343a;color:var(--blue)}.label{font-size:11px;letter-spacing:1px;color:var(--muted);padding:8px 12px 3px}.gem-list{display:flex;flex-direction:column;gap:3px;overflow:auto;max-height:48vh}.gem{background:transparent;border-radius:13px;padding:9px 11px;text-align:left;display:flex;align-items:center;gap:10px;width:100%}.gem-icon{width:31px;height:31px;border-radius:10px;background:#30343a;display:grid;place-items:center;color:var(--blue);flex-shrink:0}.gem-meta{min-width:0}.gem-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gem-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.add{color:var(--blue)}.bottom{margin-top:auto;color:var(--muted);font-size:11px;padding:8px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px}.icon{width:40px;height:40px;border-radius:50%;background:transparent;font-size:20px}.icon:hover{background:var(--p2)}.title{font-size:17px}.spacer{flex:1}.status{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:18px}.chat{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}.welcome{margin:auto 0;text-align:center;max-width:600px}.welcome h1{font-size:clamp(28px,5vw,42px);font-weight:500;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.messages{width:min(760px,100%);display:flex;flex-direction:column;gap:16px;margin:auto 0}.message{max-width:88%;padding:12px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#30343a}.message.model{align-self:flex-start;background:transparent;padding-left:3px}.who{font-size:11px;color:var(--muted);margin-bottom:5px}.composer-wrap{padding:8px 16px max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center}.composer-box{width:min(760px,100%)}.composer{background:#1e1f20;border:1px solid #383a3d;border-radius:27px;padding:10px 12px;display:flex;gap:9px;align-items:flex-end}.composer textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--text);min-height:28px;max-height:130px;padding:6px}.send{background:var(--blue);color:#172234;border-radius:50%;width:38px;height:38px;font-weight:700}.hint{text-align:center;color:#85888c;font-size:10px;margin-top:7px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:4}.overlay.show{display:block}.modal{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 30px));max-height:90dvh;overflow:auto;background:#242628;border:1px solid var(--line);border-radius:20px;padding:20px;display:none;box-shadow:0 16px 60px #0008}.modal h2{font-size:20px;font-weight:500;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea{background:#171819;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}.field textarea{min-height:105px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.action{padding:9px 15px;border-radius:20px;background:#3a3d40}.primary{background:var(--blue);color:#172234}.danger{color:#ffb4ab}@media(max-width:700px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:min(310px,86vw);transform:translateX(-105%);transition:transform .2s;box-shadow:8px 0 30px #0005}.sidebar.open{transform:translateX(0)}.top{padding:0 10px}.chat{padding:16px 12px}.status{display:none}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="spark">✦</span> Gemini</div><button class="side-btn" id="newChat">＋ Новый чат</button><button class="side-btn active" id="normal">◉ Обычный чат</button><div><div class="label">МОИ GEM-БОТЫ</div><div class="gem-list" id="gemList"></div><button class="side-btn add" id="addGem">＋ Добавить Gem</button></div><div class="bottom">Gem Hub · персональный интерфейс</div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><button class="icon" id="menu">☰</button><div class="title" id="title">Gemini</div><div class="spacer"></div><span class="status">Gemini API</span><button class="icon" id="edit">⋯</button></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Привет, Ариет</h1><p>Выбери Gem в меню или начни обычный чат.</p></div><div class="messages" id="messages"></div></section><footer class="composer-wrap"><div class="composer-box"><div class="composer"><textarea id="prompt" rows="1" placeholder="Введите сообщение..."></textarea><button class="send" id="send">↑</button></div><div class="hint">Ответы генерируются Gemini. Не отправляй пароли и личные секреты.</div></div></footer></main></div>
<div class="modal" id="modal"><h2 id="modalTitle">Добавить Gem</h2><div class="field"><label>Название</label><input id="name" maxlength="45" placeholder="Например, Math Tutor"></div><div class="field"><label>Описание</label><input id="desc" maxlength="90" placeholder="Репетитор по математике"></div><div class="field"><label>Инструкции для бота</label><textarea id="instructions" placeholder="Опиши роль и правила ответов..."></textarea></div><div class="actions"><button class="action danger" id="delete" style="margin-right:auto;display:none">Удалить</button><button class="action" id="cancel">Отмена</button><button class="action primary" id="save">Сохранить</button></div></div>
<script>
const starter=[{id:"math",name:"Math Tutor",desc:"Репетитор по математике",instructions:"Объясняй математику пошагово, показывай ход решения и проверяй понимание.",icon:"∑"},{id:"code",name:"Code Assistant",desc:"Программирование",instructions:"Помогай изучать программирование, писать и отлаживать код. Объясняй решения.",icon:"⌘"},{id:"cyber",name:"Cyber Security",desc:"Кибербезопасность",instructions:"Объясняй кибербезопасность в образовательном и законном контексте.",icon:"⌑"}];
let db;try{db=JSON.parse(localStorage.getItem("gemhub_v2")||"null")}catch{}if(!db)db={gems:starter,active:"normal",chats:{normal:[]},interactions:{}};
let editing=null,busy=false;const $=id=>document.getElementById(id),key=()=>db.active;
function persist(){localStorage.setItem("gemhub_v2",JSON.stringify(db))}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderGems(){$("gemList").innerHTML="";db.gems.forEach(g=>{let b=document.createElement("button");b.className="gem"+(db.active===g.id?" active":"");b.innerHTML=`<span class="gem-icon">${esc(g.icon||"✦")}</span><span class="gem-meta"><span class="gem-name">${esc(g.name)}</span><br><span class="gem-desc">${esc(g.desc)}</span></span>`;b.onclick=()=>select(g.id);$("gemList").append(b)});$("normal").classList.toggle("active",db.active==="normal")}
function select(id){db.active=id;if(!db.chats[id])db.chats[id]=[];let g=db.gems.find(x=>x.id===id);$("title").textContent=g?g.name:"Gemini";$("prompt").placeholder=g?`Сообщение для ${g.name}...`:"Введите сообщение...";closeSide();renderGems();renderChat();persist()}
function renderChat(){let a=db.chats[key()]||[];$("messages").innerHTML="";$("welcome").style.display=a.length?"none":"block";a.forEach(m=>{let d=document.createElement("div");d.className="message "+(m.role==="user"?"user":"model");d.innerHTML=`<div class="who">${m.role==="user"?"Вы":esc(m.label||"Gemini")}</div>${esc(m.text)}`;$("messages").append(d)});$("chat").scrollTop=$("chat").scrollHeight}
function add(role,text,label){db.chats[key()].push({role,text,label});persist();renderChat()}
function closeSide(){$("sidebar").classList.remove("open");if($("modal").style.display!=="block")$("overlay").classList.remove("show")}
function openModal(id=null){editing=id;let g=db.gems.find(x=>x.id===id);$("modalTitle").textContent=g?"Настройки Gem":"Добавить Gem";$("name").value=g?.name||"";$("desc").value=g?.desc||"";$("instructions").value=g?.instructions||"";$("delete").style.display=g?"block":"none";$("modal").style.display="block";$("overlay").classList.add("show")}
function closeModal(){$("modal").style.display="none";if(!$("sidebar").classList.contains("open"))$("overlay").classList.remove("show")}
async function send(){if(busy)return;let message=$("prompt").value.trim();if(!message)return;add("user",message);$("prompt").value="";$("prompt").style.height="28px";busy=true;$("send").textContent="…";try{let gem=db.gems.find(g=>g.id===db.active);let body={message,systemInstruction:gem?.instructions||"Отвечай как полезный универсальный ассистент.",previousInteractionId:db.interactions[key()]||null};let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error||"Ошибка API");if(data.interactionId)db.interactions[key()]=data.interactionId;add("model",data.text||"Пустой ответ",gem?.name||"Gemini")}catch(e){add("model","Ошибка: "+e.message,"Система")}finally{busy=false;$("send").textContent="↑"}}
$("menu").onclick=()=>{$("sidebar").classList.add("open");$("overlay").classList.add("show")};$("overlay").onclick=()=>{closeSide();closeModal()};$("normal").onclick=()=>select("normal");$("newChat").onclick=()=>{db.chats[key()]=[];delete db.interactions[key()];persist();renderChat();closeSide()};$("addGem").onclick=()=>openModal();$("edit").onclick=()=>openModal(db.active==="normal"?null:db.active);$("cancel").onclick=closeModal;$("send").onclick=send;$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("prompt").oninput=e=>{e.target.style.height="28px";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px"};
$("save").onclick=()=>{let name=$("name").value.trim();if(!name){$("name").focus();return}let v={name,desc:$("desc").value.trim(),instructions:$("instructions").value.trim(),icon:"✦"};if(editing)Object.assign(db.gems.find(g=>g.id===editing),v);else{v.id="gem_"+Date.now();db.gems.push(v);db.chats[v.id]=[];db.active=v.id}persist();renderGems();select(db.active);closeModal()};
$("delete").onclick=()=>{if(!editing||!confirm("Удалить Gem и его локальную историю?"))return;db.gems=db.gems.filter(g=>g.id!==editing);delete db.chats[editing];delete db.interactions[editing];db.active="normal";persist();renderGems();select("normal");closeModal()};
renderGems();select(db.active);if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script></body></html>
